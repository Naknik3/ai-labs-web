<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AI-LABZ specimen viewer</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #stage { width: 100%; height: 100%; margin: 0; }
      html, body { overflow: hidden; background: transparent; }
      #stage { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script>
      window.modelViewer = {
        _q: [],
        setModel: function (key, level) { this._q.push([key, level]); }
      };
    </script>
    <script src="./model-viewer.bundle.js"></script>
  </body>
</html>
