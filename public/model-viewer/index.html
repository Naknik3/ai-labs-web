<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>AI-LABZ specimen viewer</title>
    <style>
      * { box-sizing: border-box; }
      html, body, #stage { width: 100%; height: 100%; margin: 0; }
      html, body { overflow: hidden; background: transparent; }
      #stage { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <script>
      window.modelViewer = {
        _q: [],
        setModel: function (key, level) { this._q.push([key, level]); }
      };
    </script>
    <script src="./model-viewer.bundle.js"></script>
    <script>
      // The parent must not hide the static image until WebGL is actually
      // available. This matters on mobile Safari, where an iframe can finish
      // loading even when the renderer cannot create a context.
      (() => {
        const source = "ai-labz-model-viewer";
        const post = (type) => window.parent.postMessage({ source, type }, "*");
        const canRender = () => {
          const canvas = document.querySelector("canvas");
          if (!canvas) return false;
          try {
            return Boolean(
              canvas.getContext("webgl2") ||
                canvas.getContext("webgl") ||
                canvas.getContext("experimental-webgl"),
            );
          } catch {
            return false;
          }
        };
        const viewer = window.modelViewer;
        const setModel = viewer.setModel;
        viewer.setModel = function setModelWithStatus(...args) {
          const result = setModel.apply(this, args);
          window.setTimeout(() => post(canRender() ? "ready" : "failed"), 0);
          return result;
        };
      })();
    </script>
  </body>
</html>
